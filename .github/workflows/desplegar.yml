# Integración y despliegue continuo.
# En cada push a main: instala, comprueba (lint, tipos, tests), compila y despliega en Firebase Hosting.
# Si no están configurados los secretos de Firebase, se compila y prueba igualmente pero no se despliega.
# Las reglas, los índices y las Cloud Functions se despliegan solo si la variable DESPLEGAR_BACKEND = 'true'.

name: Comprobar y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Compilar Cloud Functions
        run: npm ci && npm run build
        working-directory: functions

  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Probar las reglas de Firestore con el emulador
        run: npm run test:reglas

  desplegar:
    needs: [comprobar, reglas]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAY_CREDENCIALES: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.VITE_FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar la app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_RESPONSABLE_NOMBRE: ${{ vars.VITE_RESPONSABLE_NOMBRE }}
          VITE_CONTACTO_EMAIL: ${{ vars.VITE_CONTACTO_EMAIL }}
      - name: Aviso si faltan secretos
        if: env.HAY_CREDENCIALES != 'true'
        run: echo "::warning::Faltan los secretos de Firebase (ver SETUP.md). Se omite el despliegue."
      # Primero reglas, índices y funciones: así la web nueva nunca llega a producción con unas
      # reglas antiguas que rechazarían sus escrituras
      - name: Desplegar reglas, índices y Cloud Functions
        if: env.HAY_CREDENCIALES == 'true' && vars.DESPLEGAR_BACKEND == 'true'
        # El secreto va por una variable de entorno y se escribe con printf: metido directamente
        # en el script, una comilla del JSON lo rompería y se enmascara peor en los registros
        env:
          CUENTA_SERVICIO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROYECTO: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$CUENTA_SERVICIO" > "$RUNNER_TEMP/cuenta.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cuenta.json"
          npm --prefix functions ci
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,functions --project "$PROYECTO" --non-interactive --force
          rm -f "$RUNNER_TEMP/cuenta.json"
      - name: Desplegar en Firebase Hosting
        if: env.HAY_CREDENCIALES == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
